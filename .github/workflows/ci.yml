name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI app
        run: swift build --package-path macos
      - name: Build local app bundle
        run: bash macos/build-app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "macos/dist/Magazine Scan.app" MagazineScan-macOS.zip
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: MagazineScan-macOS
          path: MagazineScan-macOS.zip
          if-no-files-found: error
